[package]
name = "atelier"
version = "0.1.0"
description = "Atelier"
authors = []
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "atelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
libc = "0.2"
tauri-plugin-notification = "2.8"
tauri-plugin-dialog = "2"
mpris = "2.1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# Debug builds: line tables for our code only, no debug info for dependencies (shrinks target/ by about half).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

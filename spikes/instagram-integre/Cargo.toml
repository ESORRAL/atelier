[package]
name = "spike-instagram-integre"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone: not part of any parent workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable` exposes Window::add_child (multiwebview), the only way to embed a page in the main window.
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

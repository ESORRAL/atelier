<!doctype html>
<meta charset="utf-8">
<title>scroll test</title>
<style>
  body { margin: 0; background: #000; }
  .reel { height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; }
  .reel img, .reel video { width: 100%; height: 100%; object-fit: cover; }
  .cap { position: absolute; bottom: 16px; left: 16px; color: #fff; font: 14px sans-serif; text-shadow: 0 0 4px #000; }
</style>
<body>
<script>
  // Reels-like feed: alternating full-height looping videos and large images, scrolled one screen at a time.
  const q = new URLSearchParams(location.search);
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'reel';
    d.innerHTML = i % 2 === 0
      ? `<video src="media/reel${(i / 2) % 6}.mp4" autoplay muted loop playsinline></video>`
      : `<img src="media/img${i % 30}.jpg" decoding="async">`;
    d.insertAdjacentHTML('beforeend', `<div class="cap">reel ${i}</div>`);
    document.body.appendChild(d);
  }
  // ?audio=1: a silent WebAudio graph, as Instagram keeps (seen in its web process: webaudioSrc threads).
  if (q.get('audio') === '1') {
    const ac = new AudioContext(), osc = ac.createOscillator(), g = ac.createGain();
    g.gain.value = 0; osc.connect(g).connect(ac.destination); osc.start();
    addEventListener('click', () => ac.resume(), { once: true });
  }
  const report =(k, v) => fetch(`/report?run=${q.get('run')}&${k}=${encodeURIComponent(v)}`).catch(() => {});
  const deltas = [];
  let last = 0, measuring = false;
  function tick(t) {
    if (measuring && last) deltas.push(t - last);
    last = t;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  document.addEventListener('visibilitychange', () => report('vis', document.visibilityState));
  const secs = Number(q.get('secs') || 20);
  setTimeout(() => {
    report('vis', document.visibilityState);
    measuring = true;
    let n = 0;
    // Smooth scroll by one screen every 1.2 s, like swiping through reels.
    const step = () => { if (q.get('scroll') !== '0') scrollBy({ top: innerHeight, behavior: 'smooth' }); n++; };
    const id = setInterval(step, 1200);
    setTimeout(() => {
      clearInterval(id);
      measuring = false;
      const s = deltas.slice().sort((a, b) => a - b);
      const p = (x) => s.length ? s[Math.min(s.length - 1, Math.floor(x * s.length))].toFixed(1) : 'na';
      const ms = deltas.reduce((a, b) => a + b, 0);
      report('frames', [
        `n=${s.length}`, `fps=${(s.length / (ms / 1000 || 1)).toFixed(1)}`, `p50=${p(0.5)}`, `p95=${p(0.95)}`,
        `p99=${p(0.99)}`, `max=${s.length ? s[s.length - 1].toFixed(0) : 'na'}`,
        `long=${deltas.filter((d) => d > 34).length}`, `size=${innerWidth}x${innerHeight}`, `swipes=${n}`,
      ].join(' '));
    }, secs * 1000);
  }, 3000);
</script>
</body>

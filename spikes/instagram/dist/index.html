<!doctype html>
<meta charset="utf-8">
<title>main</title>
<p id="out">calling probe…</p>
<script>
  // Control: the main window holds a capability, so this call must reach Rust.
  window.__TAURI__.core.invoke('probe')
    .then(r => { document.getElementById('out').textContent = r; })
    .catch(e => { document.getElementById('out').textContent = 'probe failed: ' + e; });
</script>
